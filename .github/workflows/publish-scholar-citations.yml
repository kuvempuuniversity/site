name: Publish approved Scholar citation snapshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/install_scholar_citations.py
      - assets/js/scholar-citations.js
      - data/environmental-scholar-citations.json
      - .github/workflows/publish-scholar-citations.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-scholar-citations
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Connect the approved cached snapshot
        run: python scripts/install_scholar_citations.py
      - name: Validate JavaScript and cached citation data
        run: |
          node --check assets/js/department-research.js
          node --check assets/js/publications.js
          node --input-type=module --check < assets/js/scholar-citations.js
          python -m json.tool data/environmental-scholar-citations.json > /dev/null
      - name: Commit renderer integration
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/department-research.js assets/js/publications.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Use disclosed Scholar paper counts for Environmental Science"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
