name: Publish reviewed expanded citation refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/apply_citation_refresh.py
      - .github/workflows/apply-citation-refresh.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: apply-citation-refresh
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and apply reviewed DOI citation results
        run: |
          python -m py_compile scripts/apply_citation_refresh.py
          python scripts/apply_citation_refresh.py
      - name: Validate output and preserve publication and profile records
        run: |
          python -m json.tool data/citation-metrics.json > /dev/null
          python -m json.tool data/citation-refresh-apply-status.json > /dev/null
          node --check assets/js/publications.js
          git diff --exit-code -- data/faculty.json data/research-students.json data/publications.json data/student-citation-metrics.json data/environmental-scholar-citations.json research-showcase-draft.html
      - name: Commit validated citation cache
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/citation-metrics.json data/citation-refresh-apply-status.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Publish validated citation counts for expanded ORCID publication collection"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
