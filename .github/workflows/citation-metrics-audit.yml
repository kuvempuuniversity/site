name: Citation metrics audit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: citation-metrics-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test citation matching and failure handling
        run: python -m unittest discover -s tests -p 'test_citation_metrics.py' -v
      - name: Retrieve DOI-matched citation counts (review only)
        run: python scripts/sync_citation_metrics.py --out citation-audit
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      - name: Save proposed metrics and audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citation-metrics-audit
          path: citation-audit/
          if-no-files-found: warn
          retention-days: 7
