name: Physical Education portraits and dual-role profiles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/apply_physical_education_photos.py
      - .github/workflows/physical-education-photos.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: physical-education-photos
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and apply approved Physical Education mappings
        run: |
          python -m py_compile scripts/apply_physical_education_photos.py
          python scripts/apply_physical_education_photos.py
      - name: Validate data and existing profile renderers
        run: |
          python -m json.tool data/faculty.json > /dev/null
          python -m json.tool data/research-students.json > /dev/null
          python -m json.tool data/physical-education-photo-sync-status.json > /dev/null
          node --check assets/js/faculty.js
          node --check assets/js/research-students.js
          test -f faculty/profile.html
          test -f students/profile.html
          test -f departments/physical-education.html
      - name: Commit approved profile and portrait updates
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/faculty.json data/research-students.json data/physical-education-photo-sync-status.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Connect Physical Education portraits and preserve dual-role profile cards"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
